<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transition</title>
    <style>
        .box{
            border: 1dvw solid;
            background-color: red;
            width: 10%;
            transition: ease-in-out all 3s;
            transition-delay: 1s;
        }
        .box:hover{
            width: 100%;
            background-color: yellow;
        }
    </style>
</head>
<body>
    <div class="box">Box</div>
</body>
</html>
