    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible</title>
    <style>
        body{
            background-color: yellow;
        }
        @media screen and (min-width: 769px) and (max-width: 991px) {
            body{

        body{
            background-color: green;
        }
    }
    </style>
</head>
