{% extends 'base.html' %}
{%block title%}
{{block.super}}
{%endblock%}
{% block content %}
<div class="container py-5">
    <form class="container mx-auto card p-4" action="{% url 'detail_save' %}" method="post">
        <div class="mb-3">
            {% csrf_token %}
            <label for="title">Note Title</label>
            <input name="Title" type="text" id="title" class="form-control" placeholder="Enter Note title">
            
        </div>
        <div class="mb-3">
            <label for="title">Note Description</label>
            <textarea name="Description" rows="5" id="title" class="form-control" placeholder="Enter note Descrioption"></textarea>
        </div>
        <div class="mb-3">
            <button style="width: 100%; height: 50px;" class="btn btn-primary" >Add note <i class="fa-regular fa-note-sticky"></i></button>
        </div>
    </form>
</div>
{% endblock %}
