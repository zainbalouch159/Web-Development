{% extends 'base.html' %}
{%block title%}
{{block.super}}
{%endblock%}
{% block content %}
<div class="container py-5">

    <form class="container mx-auto card p-4" action="{% url 'edit page' id=note.id%}" method="post">
        <div class="mb-3">
            {% csrf_token %}
            
            {% include 'components/ShowMessage.html' %}


            <label for="title">Note Title</label>
            <input name="Title" type="text" id="title" class="form-control" placeholder="Enter Note title" value="{{note.Title}}">
            
        </div>
        <div class="mb-3">
            <label for="Description">Note Description</label>
            <textarea value="" name="Description" rows="5" id="Description" class="form-control" placeholder="Enter note Description" >{{note.Description}}</textarea>
        </div>
        <input type="checkbox" value="{{note.isPublish}}" class="p-4" name="Publish" {% if note.isPublish %} checked {% endif %}> 
        <label for="Publish">Status</label>
        <div class="mb-3">
            <button style="width: 100%; height: 50px;" class="btn btn-primary" >Add note <i class="fa-regular fa-note-sticky"></i></button>
        </div>
    </form>
</div>
{%endblock%}
