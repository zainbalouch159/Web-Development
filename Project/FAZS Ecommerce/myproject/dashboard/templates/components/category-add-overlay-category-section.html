<!-- category-add-modal for Category Section -->

<!-- Background Overlay  -->
<div id="Category-add-Overlay_categorty_section"
    class="z-50 fixed inset-0 hidden justify-center items-center bg-black/50 backdrop-blur-md  text-orange-500">

    <!-- Modal  -->
    <div class="flex flex-col justify-center items-center w-[50dvw] h-[50dvh] bg-orange-100 rounded">
        <div class="font-extrabold text-orange-500 m-5">Add Category</div>

        <!-- Form  -->
        <form action="{% url 'add_product_to_category' %}" id="category-add-form" method="post"
            class="flex flex-col justify-center items-center gap-2">

            {% csrf_token %}

            <div class="flex flex-col gap-2 items-center w-72 justify-between">

                <div>
                    <label for="category-name-add   " class="text-orange-500 font-bold mx-2">Name</label>
                    <input type="text" id="" name="category-name"
                        class="rounded px-1 border border-orange-500 outline-orange-500 focus:outline-orange-500"
                        placeholder="Enter Category Name">
                </div>

                {% if Products %}
                <div class="flex gap-2 items-center w-72    ">
                    <label for="category-add-products" class="text-orange-500 font-bold mx-2">Add Products
                    </label>
                    <select id="" name="category-add-products"
                        class="rounded px-1 border border-orange-500 focus:outline-orange-500 h-8 overflow-y-auto"
                        multiple>
                        {% for product in Products %}
                        <option class="my-1 text-orange-500 rounded" value="{{ product.id }}">{{ product.name }}
                        </option>
                        {% endfor %}

                    </select>
                </div>
                {% endif %}
            </div>

            <button type="submit" class="p-2 bg-orange-500 text-white font-bold rounded">Save</button>

        </form>
    </div>
</div>
