<!-- Product-add-modal -->

<!-- Background Overlay -->
<div
  id="Overlay"
  class="fixed inset-0 hidden justify-center items-center bg-black/50 backdrop-blur-md text-orange-500"
>
  <!-- Modal -->
  <div
    class="flex flex-col justify-center items-center w-[50dvw] h-[80dvh] bg-orange-100 rounded"
  >
    <div class="font-extrabold text-orange-500 m-5">Product Details</div>

    <!-- Form -->
    <form
      action="{% url 'add_product' %}"
      id="product-add-form"
      method="post"
      enctype="multipart/form-data"
      class="flex flex-col justify-center items-center gap-2"
    >
      {% csrf_token %}

      <!-- Name -->
      <div class="flex items-center w-72 justify-between">
        <label for="product-name-add" class="text-orange-500 font-bold mx-2">
          Name
        </label>

        <input
          type="text"
          id="product-name-add"
          name="name"
          class="rounded px-1 border border-orange-500 outline-orange-500 focus:outline-orange-500"
        />
      </div>

      <!-- Description -->
      <div class="flex items-center w-72 justify-between">
        <label
          for="product-description-add"
          class="text-orange-500 font-bold mx-2"
        >
          Description
        </label>

        <textarea
          name="description"
          id="product-description-add"
          rows="2"
          class="resize-none rounded px-1 border border-orange-500 outline-orange-500 focus:outline-orange-500"
        ></textarea>
      </div>

      <!-- Price -->
      <div class="flex items-start w-72 justify-start">
        <label for="product-price-add" class="text-orange-500 font-bold mx-2">
          Price
        </label>

        <span class="p-1">Rs</span>

        <input
          type="number"
          name="price"
          id="product-price-add"
          class="rounded pl-1 border border-orange-500 outline-orange-500 focus:outline-orange-500 w-10"
        />
      </div>

      <!-- Stock -->
      <div class="flex items-start w-72 justify-start">
        <label for="product-stock-add" class="text-orange-500 font-bold mx-2">
          Stock
        </label>

        <input
          type="number"
          name="stock"
          id="product-stock-add"
          required
          class="rounded pl-1 border border-orange-500 outline-orange-500 focus:outline-orange-500 w-10"
        />
      </div>

      <!-- Image -->
      <div class="flex items-center gap-1 w-72 justify-start">
        <i class="fa-solid fa-file-image"></i>

        <input
          type="file"
          name="image"
          id="product-image-add"
          required
          class="rounded px-1 border border-orange-500 outline-orange-500 focus:outline-orange-500 w-full"
        />
      </div>

      <!-- Discount -->
      <div class="flex items-start w-72 justify-start">
        <label
          for="product-discount-add"
          class="text-orange-500 font-bold mx-2"
        >
          Discount
        </label>

        <input
          type="number"
          name="discount"
          id="product-discount-add"
          class="rounded pl-1 border border-orange-500 outline-orange-500 focus:outline-orange-500 w-10"
        />

        %
      </div>

      <!-- Info -->
      <div class="flex items-center w-72 justify-between">
        <label for="product-Info-add" class="text-orange-500 font-bold mx-2">
          Info
        </label>

        <textarea
          name="info"
          id="product-Info-add"
          class="resize-none rounded px-1 border border-orange-500 outline-orange-500 focus:outline-orange-500"
        ></textarea>
      </div>

      <!-- Category -->
      <div class="flex items-center w-72 justify-start">
        <label
          for="category-menu-product-add"
          class="text-orange-500 font-bold mx-2"
        >
          Category
        </label>

        <!-- Select existing category from the dropdown -->
        <select
          id="category-menu-product-add"
          name="category"
          class="focus:outline-orange-500"
        >
          <option>Select</option>

          {% for Category in Categories %}
          <option value="{{ Category.id }}">{{ Category.name }}</option>
          {% endfor %}
        </select>

        <!-- Add Category -->
        <i
          id="add-category-button-product-add"
          class="fa-solid fa-plus text-orange-500 pl-2"
        ></i>
      </div>

      <!-- Collections -->
      <div class="flex items-center w-72 justify-start">
        <label for="Collections-menu-product-add" class="text-orange-500 font-bold mx-2">
          Collections
        </label>

        <!-- Select multiple Collecitons -->
        <select
          id="Collections-menu-product-add"
          name="collections"
          multiple
          class="text-orange-500 bg-orange-200 rounded focus:outline-orange-500 overflow-y-auto h-7"
        >
          {% for Collection in Collections %}
          <option class="p-1" value="{{ Collection.id }}">
            {{ Collection.title }}
          </option>
          {% endfor %}
        </select>

        <!-- Add Collections -->
        <div id="add-Collections-button-product-add">
          <i class="fa-solid fa-plus text-orange-500 my-auto ml-2"></i>
        </div>
      </div>

      <!-- Submit -->
      <button
        type="submit"
        class="p-2 bg-orange-500 text-white font-bold rounded"
      >
        Save
      </button>
    </form>
  </div>
</div>
