<!-- collection-add-modal for Collection Section -->

<!-- Background Overlay -->
<div
  id="Collection-add-Overlay_collection"
  class="z-50 fixed inset-0 hidden justify-center items-center bg-black/50 backdrop-blur-md text-orange-500"
>
  <!-- Modal -->
  <div
    class="flex flex-col justify-center items-center w-[50dvw] h-[50dvh] bg-orange-100 rounded"
  >
    <div class="font-extrabold text-orange-500 m-5">Add Collection</div>

    <!-- Form -->
    <form
      action="{% url 'add_product_to_collection' %}"
      id="collection-add-form"
      method="post"
      class="flex flex-col justify-center items-center gap-2"
    >
      {% csrf_token %}

      <div class="flex flex-col gap-2 items-center w-72 justify-between">
        <div>
          <label
            for="collection-name-add"
            class="text-orange-500 font-bold mx-2"
          >
            Name
          </label>

          <input
            type="text"
            id="collection-name-add"
            name="collection-name"
            class="rounded px-1 border border-orange-500 outline-orange-500 focus:outline-orange-500"
            placeholder="Enter Collection Name"
          />
        </div>

        {% if Products %}
        <div class="flex gap-2 items-center w-72">
          <label
            for="collection-add-products"
            class="text-orange-500 font-bold mx-2"
          >
            Add Products
          </label>

          <select
            id="collection-add-products"
            name="collection-add-products"
            class="rounded px-1 border border-orange-500 focus:outline-orange-500 h-8 overflow-y-auto"
            multiple
          >
            {% for product in Products %}
            <option
              class="my-1 text-orange-500 rounded"
              value="{{ product.id }}"
            >
              {{ product.name }}
            </option>
            {% endfor %}
          </select>
        </div>
        {% endif %}
      </div>

      <button
        type="submit"
        class="p-2 bg-orange-500 text-white font-bold rounded"
      >
        Save
      </button>
    </form>
  </div>
</div>
