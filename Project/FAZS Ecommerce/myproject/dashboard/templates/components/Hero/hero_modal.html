<!-- Hero Add Modal -->

<!-- Background Overlay -->
<div
  id="Hero-add-Overlay"
  class="fixed z-50 hidden inset-0 justify-center items-center bg-black/50 backdrop-blur-md"
>
  <!-- Modal -->
  <div
    class="flex flex-col justify-center items-center w-[50dvw] h-[70dvh] bg-orange-100 rounded"
  >
    <div class="font-extrabold m-5 text-orange-500">Add Hero</div>

    <!-- Form -->
    <form
      action="{% url 'add_hero' %}"
      id="hero-add-form"
      method="post"
      enctype="multipart/form-data"
      class="flex flex-col justify-center items-center gap-3 text-orange-500"
    >
      {% csrf_token %}

      <!-- Title -->
      <div class="flex items-center w-80 justify-between">
        <label for="hero-title" class="font-bold mx-2"> Title </label>

        <input
          type="text"
          id="hero-title"
          name="title"
          class="rounded px-2 py-1 border border-orange-500 outline-orange-500"
          placeholder="Enter Hero title"
        />
      </div>

      <!-- Subtitle -->
      <div class="flex items-center w-80 justify-between">
        <label for="hero-subtitle" class="font-bold mx-2"> Subtitle </label>

        <input
          type="text"
          id="hero-subtitle"
          name="subtitle"
          class="rounded px-2 py-1 border border-orange-500 outline-orange-500"
          placeholder="Enter subtitle"
        />
      </div>

      <!-- Image -->
      <div class="flex items-center w-80 justify-between">
        <label for="hero-image" class="font-bold mx-2"> Image </label>

        <input
          type="file"
          id="hero-image"
          name="image"
          accept="image/*"
          class="w-52 text-sm border border-orange-500 outline-orange-500 px-1"
        />
      </div>

      <!-- Discount -->
      <div class="flex items-center w-80 justify-between">
        <label for="hero-discount" class="font-bold mx-2"> Discount </label>
        <div>
        <input
          type="number"
          id="hero-discount"
          name="discount"
          min="0" max="99"
          class="w-10 pl-1 rounded border border-orange-500 outline-orange-500"
        />%</div>
      </div>

      <!-- Product -->
      <div class="flex items-center w-80 justify-between">
        <label for="hero-product" class="font-bold mx-2"> Product </label>

        <select
          id="hero-product"
          name="products"
          class="rounded px-2 py-1 border border-orange-500 outline-orange-500"
        >
          {% for product in Products %}
          <option value="{{ product.id }}">{{ product.name }}</option>
          {% endfor %}
        </select>
      </div>

      <!-- Background Color -->
      <div class="flex items-center w-80 justify-between">
        <label for="hero-bg-color" class="font-bold mx-2"> BG Color </label>

        <input
          type="color"
          id="hero-bg-color"
          name="bg_color"
          value="#FFB86A"
          class="w-12 h-8"
        />
      </div>

      <!-- Font / Button Color -->
      <div class="flex items-center w-80 justify-between">
        <label for="hero-font-btn-color" class="font-bold mx-2">
          Font/Btn Color
        </label>

        <input
          type="color"
          id="hero-font-btn-color"
          name="font_btn_color"
          value="#FF6900"
          class="w-12 h-8"
        />
      </div>

      <!-- Save -->
      <button
        type="submit"
        class="p-2 bg-orange-500 text-white font-bold rounded"
      >
        Save
      </button>
    </form>
  </div>
</div>
