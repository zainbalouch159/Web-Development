{% extends 'main.html' %}
{% load static %}
{% block content %}

<div class=" h-12 px-2 flex justify-between items-center w-full">

    <!-- Logo  -->
    <a href="{% url 'home' %}" class="h-full">
        <img src="{% static 'images/logo.png' %}" alt="logo" class=" object-fit h-full w-auto">
    </a>

    <!-- Navigations  -->
    <div class="navigations flex gap-3.5 ml-50 text-orange-500 font-bold" style="font-family: 'Montserrat';">
        <a href="{% url 'home' %}">Home</a><a href="{% url 'product' %}">Product</a>
        <a href="{% url 'contact' %}">Contact</a>
    </div>

    <div class="right flex  h-full items-center gap-2 ">

        <!-- Search -->

        <form action="{% url 'search' %}" method="get" class="flex overflow-hidden  w-fit">

            <input type="text" name="q" id="search_input"
                class="px-1 w-50 rounded border-2 border-orange-500   outline-orange-500   focus:outline-orange-500    translate-x-full opacity-0 pointer-events-none  duration-500  transition-all">

            <div class="px-2"><span><button id="search" type="button"
                        class="fa-solid fa-magnifying-glass"></button></span></div>

        </form>

        <div class=" h-full mx-2 flex gap-2  items-center  w-fit overflow-hidden">
            <i class="fa-solid fa-cart-shopping"></i>

            <a href="" class=" p-2 mx-2 inline-block rounded bg-orange-500  text-white ">Login</a>
        </div>
    </div>
</div>


{% endblock %}
{% block script %}
<script src="{% static 'js/navbar.js' %}"></script>
{% endblock %}
