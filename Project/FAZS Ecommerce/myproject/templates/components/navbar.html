{% load static %}
<div class="h-12 px-2 flex justify-between items-center w-full">

    <!-- Logo -->
    <a href="{% url 'home' %}" class="h-full">
        <img src="{% static 'images/logo.png' %}" alt="logo" class="object-contain h-full w-auto">
    </a>

    <div class="right flex h-full items-center gap-2">

        <!-- Search -->
        <form action="{% url 'search' %}" method="get" class="flex overflow-hidden w-fit">

            <input type="text" name="q" id="search_input" class="px-1 w-50 rounded border-2 border-orange-500
                       outline-orange-500 focus:outline-orange-500
                       translate-x-full opacity-0 pointer-events-none
                       duration-500 transition-all">

            <div class="px-2">
                <button id="search" type="button" class="fa-solid fa-magnifying-glass">
                </button>
            </div>

        </form>

        <!-- Cart and Login -->
        <div class="h-full mx-2 flex gap-2 items-center w-fit overflow-hidden">

            <i class="fa-solid fa-cart-shopping"></i>

            {% if user.is_authenticated %}
            <a href="{% url 'logout' %}" class="p-2 mx-2 inline-block rounded bg-orange-500 text-white font-bold">
                Logout
            </a>
            {% else %}
            <a href="{% url 'login' %}" class="p-2 mx-2 inline-block rounded bg-orange-500 text-white font-bold">
                Login
            </a>
            {% endif %}
        </div>

    </div>
</div>

{% block script %}
<script src="{% static 'js/search_animation.js' %}"></script>
{% endblock %}
