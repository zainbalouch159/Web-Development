<script>
    document.getElementById("newsletter-input").addEventListener("invalid", function(){
        let error = document.getElementById("email-error")
        error.style.display='block'
        let input = document.getElementById("newsletter-input")
        input.classList.add("error")
    })
    document.getElementById("newsletter-input").addEventListener("submit", function(){
        let email = document.getElementById("newsletter-input")

    })
    document.getElementById("newsletter-form").addEventListener("submit", function(){
        let email = document.getElementById("newsletter-input").value
        sessionStorage.setItem("email",email)

    })
</script>
