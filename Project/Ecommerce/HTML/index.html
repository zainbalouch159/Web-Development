<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FAZS</title>
    <link rel="stylesheet" href="/CSS/style.css">
    <link rel="stylesheet" href="/CSS/hover.css">
</head>
<body>
    <header>
        <img class="img-rotate" src="/img/logo.png" alt="">
        <div class="nav">
        <nav>
            <ul>
                <li class="link">Home</li>
                <li class="link">About</li>
                <li class="link">Contact</li>
            </ul>
        </nav>
        </div>
        <div class="search">
        <input type="search" placeholder=" Search any product">
        <button>Search</button>
        </div>
    </header>
    <main>
   <div class="slider">
    <div class="slide">
    <img src="/img/apple.png" alt="apple">
    </div>
    <div class="slide">
    <img src="/img/cream.png" alt="creams">
    </div>
    <div class="slide">
    <img src="/img/kitchen.png" alt="kitchen">
    </div>
    <div class="slide">
    <img src="/img/drinks.png" alt="drinks">
    </div>
    <div class="slide">
    <img src="/img/food.png" alt="">
    </div>
   </div>
   <div class="recommended">
    <div class="items">
        <img src="/img/camera.png" alt="camera">
        <div class="description">
        <p>With 80% dicount</p>
        <span>Rs 49999</span>
        <button>Purchase it</button>
        </div>
    </div>
    <div class="items">
        <img src="/img/cream.png" alt="cream">
        <div class="description">
        <p>3 in one</p>
        <span>Rs 999</span>
        <button>Purchase it</button>
        </div>
    </div>
    <div class="items">
        <img src="/img/powder.png" alt="Drink powder">
        <div class="description">
        <p>50% Discount</p>
        <span>Rs 499</span>
        <button>Purchase it</button>
        </div>
    </div>
    <div class="items">
        <img src="/img/perfume.png" alt="perfume">
        <div class="description">
        <p>Rich Perfume</p>
        <span>Rs 7999</span>
        <button>Purchase it</button>
        </div>
    </div>
    <div class="items">
        <img src="/img/tech-product.png" alt="">
        <div class="description">
        <p>70% Discount</p>
        <span>Rs 2499</span>
        <button>Purchase it</button>
        </div>
    </div>
    <div class="items">
        <img src="/img/hair-item.png" alt="">
        <div class="description">
        <p>30% Discount</p>
        <span>Rs 499</span>
        <button>Purchase it</button>
        </div>
    </div>
    <div class="items">
        <img src="/img/food.png" alt="">
        <div class="description">
        <p>All in one</p>
        <span>Rs 4999</span>
        <button>Purchase it</button>
        </div>
    </div>
    <div class="items">
        <img src="/img/apple.png" alt="">
        <div class="description">
        <p>Discount 80%</p>
        <span>Rs 159999</span>
        <button>Purchase it</button>
        </div>
    </div>
    <div class="items">
        <img src="/img/kitchen.png" alt="">
        <div class="description">
        <p>90% Discount</p>
        <span>Rs 7999</span>
        <button>Purchase it</button>
        </div>
    </div>
    <div class="items">
        <img src="/img/drinks.png" alt="">
        <div class="description">
        <p>Discount 40%</p>
        <span>Rs 999</span>
        <button>Purchase it</button>
        </div>
   </div>
   </div>
   </main>
   
</body>
</html>
